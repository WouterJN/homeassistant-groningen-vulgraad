<!-- Source artwork for the integration icon.

     One Groningen underground container, drawn from the photographs on
     milieudienst.groningen.nl: a glossy black housing, squat with a shallow
     domed roof, standing on its tread plate, with the big light hatch panel
     across the front.

     The bin is below ground and never visible, so the hatch panel doubles as
     the gauge: it fills from the bottom with the level the integration
     reports.

     assets/render_logo.py draws these same shapes with Pillow to produce the
     PNG sizes that Home Assistant's brands repository expects. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#1c663e"/>

  <!-- tread plate -->
  <rect x="88" y="414" width="336" height="36" rx="11" fill="#929ba1"/>

  <!-- housing -->
  <path d="M122 234 a78 78 0 0 1 78 -78 h112 a78 78 0 0 1 78 78 v192 h-268 z"
        fill="#121417"/>

  <!-- hatch panel: empty above, fill level below -->
  <rect x="156" y="248" width="200" height="154" rx="14" fill="#e2e4de"/>
  <path d="M156 307 h200 v81 a14 14 0 0 1 -14 14 h-172 a14 14 0 0 1 -14 -14 z"
        fill="#4fb477"/>
</svg>
