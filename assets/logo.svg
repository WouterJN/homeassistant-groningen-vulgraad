<!-- Source artwork for the integration icon. A waste container with its lid
     and drop slot, filled to the level the integration reports.
     assets/render_logo.py draws the same shapes with Pillow to produce the
     PNG sizes that Home Assistant's brands repository expects. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#1f6f43"/>

  <!-- container body -->
  <path d="M126 196 H386 L356 430 L344 452 H168 L156 430 Z" fill="#0c3821"/>

  <!-- fill level, clipped to the body -->
  <clipPath id="body">
    <path d="M126 196 H386 L356 430 L344 452 H168 L156 430 Z"/>
  </clipPath>
  <rect x="0" y="300" width="512" height="212" fill="#7cd69d" clip-path="url(#body)"/>

  <!-- lid and drop slot -->
  <rect x="96" y="150" width="320" height="50" rx="25" fill="#cfe8d8"/>
  <rect x="214" y="164" width="84" height="22" rx="11" fill="#1f6f43"/>
</svg>
