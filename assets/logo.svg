<!-- Source artwork for the integration icon.

     The subject is a Groningen underground container as it looks from the
     street: a dark charcoal housing with a slightly sloping roof, the hinged
     door on the front, the stainless deposit drum beside it, the numbered
     label every unit carries, and the diamond tread plate it stands on.

     The bin is below ground and never visible, so the fill level the
     integration reports is shown as a gauge window in the door.

     assets/render_logo.py draws these same shapes with Pillow to produce the
     PNG sizes that Home Assistant's brands repository expects. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#1f6f43"/>

  <!-- tread plate -->
  <rect x="48" y="404" width="416" height="42" rx="12" fill="#8a9399"/>
  <rect x="48" y="404" width="416" height="14" rx="7" fill="#a3abb0"/>

  <!-- housing, roof sloping up towards the drum side -->
  <path d="M110 170 L402 140 V408 H110 Z" fill="#2b2f34"/>
  <path d="M110 170 L402 140 V156 L110 186 Z" fill="#3e444b"/>

  <!-- stainless deposit drum -->
  <rect x="306" y="180" width="82" height="216" rx="41" fill="#b0b8bd"/>
  <ellipse cx="347" cy="210" rx="41" ry="30" fill="#cdd4d8"/>

  <!-- gauge window in the door: empty above, fill level below -->
  <rect x="134" y="222" width="154" height="172" rx="12" fill="#16191c"/>
  <path d="M134 288 h154 v94 a12 12 0 0 1 -12 12 h-130 a12 12 0 0 1 -12 -12 z"
        fill="#7cd69d"/>

  <!-- number label -->
  <rect x="134" y="182" width="62" height="30" rx="7" fill="#d64a4a"/>
</svg>
