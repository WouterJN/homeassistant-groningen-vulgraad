name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant itself needs 3.14, and so does its test plugin.
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests -q --cov=custom_components/groningen_vulgraad --cov-report=term-missing
